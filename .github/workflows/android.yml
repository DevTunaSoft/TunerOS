name: Android build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TunerOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
