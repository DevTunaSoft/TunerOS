name: Android build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tuneros-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TunerOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-self-test:
    name: Execute TunerOS autonomous self-tests on Android 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TunerOS-debug-apk
          path: ci-apk
      - name: Enable Android emulator KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run the app's built-in checks on a low-memory emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          script: |
            set -eu
            adb install -r ci-apk/app-debug.apk
            adb shell am start -n com.devtunasoft.tuneros/.MainActivity --ez tuneros.debug.qa true
            # The app runs the checks itself; CI only collects/asserts its private
            # debug report. No human interaction, provider streams or credentials.
            for attempt in $(seq 1 60); do
              adb shell run-as com.devtunasoft.tuneros cat files/tuneros-selftest-report.txt > on-device-report.txt 2>/dev/null || true
              if grep -Fq "$(printf 'PASS\tdebug-large-guide-stress\t')" on-device-report.txt && \
                 grep -Fq "$(printf 'PASS\tdebug-ui-focus\t')" on-device-report.txt && \
                 grep -Fq "$(printf 'PASS\tdebug-empty-guide-dpad\t')" on-device-report.txt && \
                 ! adb shell run-as com.devtunasoft.tuneros ls files/tuneros-selftest-in-progress >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            for check in source-recovery-policy offline-m3u-parser offline-source-stall offline-xmltv-parser offline-channel-filter offline-timeline offline-xmltv-dtd-block scratch-dvr-copy scratch-dvr-catalog android-keystore-roundtrip debug-large-guide-stress debug-ui-focus debug-empty-guide-dpad; do
              if ! grep -Fq "$(printf 'PASS\t%s\t' "$check")" on-device-report.txt; then
                echo "On-device QA assertion failed or never completed: $check"
                cat on-device-report.txt
                exit 1
              fi
            done
            if adb shell run-as com.devtunasoft.tuneros ls files/tuneros-selftest-in-progress >/dev/null 2>&1; then
              echo "The self-test has not committed its report and cleared its run marker"
              exit 1
            fi
            if grep -q '^FAIL[[:space:]]' on-device-report.txt; then
              echo "Unexpected failure in the app's own self-test report"
              cat on-device-report.txt
              exit 1
            fi
            cat on-device-report.txt
      - name: Publish autonomous Android test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TunerOS-emulator-self-test-report
          path: on-device-report.txt
          if-no-files-found: warn
          retention-days: 14
