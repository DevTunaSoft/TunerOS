name: Android build and tests
on:
  push:
    branches: [main]
    # Documentation-only pushes should not download SDKs, build an APK, or
    # boot an emulator. Keep PR checks and manual dispatch unchanged.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:
    inputs:
      public_playlist_url:
        description: "Optional public https M3U/M3U8 playlist to import on the emulator. Not stored in the repo."
        required: false
        default: ""
      public_guide_url:
        description: "Optional public https XMLTV guide (.xml or .xml.gz) to import on the emulator. Not stored in the repo."
        required: false
        default: ""
      external_storage_check:
        description: "Optional: pick a recording folder on the emulator (tapping Allow if asked) and require external storage PASS. Dispatch only."
        type: boolean
        required: false
        default: false
concurrency:
  group: tuneros-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check emulator QA shell syntax
        run: bash -n scripts/emulator-self-test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      # QA-02/PERF-01: one bounded JVM step, no emulator and no new job. It generates a
      # deterministic 25k-channel / 250k-programme synthetic EPG twice, compares hashes,
      # imports it through the existing :core parser entry points and asserts counts,
      # hide-no-EPG, name search, future-only windows and sampled peak memory.
      - name: Large EPG deterministic fixture check (QA-02/PERF-01)
        timeout-minutes: 12
        run: bash scripts/qa_epg_fixture_check.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TunerOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # The package-upgrade check in the emulator job installs the debug APK of a base commit, seeds it, and then installs
      # this commit's APK over it with adb install -r. The base is the pull request's base commit
      # (github.event.pull_request.base.sha). For a push it is the commit that the push replaced (github.event.before), and
      # for a manual run it is the commit before the dispatched one. It is exported with git archive into a directory of its
      # own, outside the checkout, and built there with the same Gradle wrapper, JDK and SDK as the head. Only
      # :app:assembleDebug runs for the base, so the base's unit tests are not repeated here.
      # Both APKs are built on this runner, so they share one debug signing key. Debug builds have no signingConfig and are
      # signed with the runner's ~/.android/debug.keystore, which a different runner would not have, and adb install -r fails
      # when the certificates differ. The check below stops the job before that can happen.
      - name: Build the upgrade base commit's debug APK
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            base_sha=$(git rev-parse HEAD^)
          fi
          git fetch --no-tags --depth=1 origin "$base_sha" || git fetch --no-tags origin "$base_sha"
          base_dir="$RUNNER_TEMP/upgrade-base"
          rm -rf "$base_dir"
          mkdir -p "$base_dir"
          git archive "$base_sha" | tar -x -C "$base_dir"
          (cd "$base_dir" && ./gradlew --no-daemon :app:assembleDebug)
          mkdir -p upgrade-base
          cp "$base_dir/app/build/outputs/apk/debug/app-debug.apk" upgrade-base/app-debug.apk
          echo "$base_sha" > upgrade-base/base-sha.txt
          echo "Upgrade base commit: $base_sha"
      - name: Check the head and base debug APKs share one signing certificate
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cert() {
            local out
            out=$("$apksigner" verify --print-certs "$1")
            grep 'SHA-256 digest' <<<"$out" | sed -n '1p'
          }
          head_cert=$(cert app/build/outputs/apk/debug/app-debug.apk)
          base_cert=$(cert upgrade-base/app-debug.apk)
          test -n "$head_cert"
          test "$head_cert" = "$base_cert"
          echo "Head and base debug APKs share one certificate: ${head_cert##*: }"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TunerOS-upgrade-base-apk
          path: upgrade-base
          if-no-files-found: error

  emulator-self-test:
    name: Execute TunerOS autonomous self-tests on Android 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TunerOS-debug-apk
          path: ci-apk
      # The base APK for the package-upgrade check. See the build job for which commit it is and why it shares a signing key.
      - uses: actions/download-artifact@v4
        with:
          name: TunerOS-upgrade-base-apk
          path: ci-upgrade-base
      - name: Enable Android emulator KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run the app's built-in checks on a low-memory emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          script: bash scripts/emulator-self-test.sh
        env:
          PUBLIC_PLAYLIST_URL: ${{ inputs.public_playlist_url }}
          PUBLIC_GUIDE_URL: ${{ inputs.public_guide_url }}
          EXTERNAL_STORAGE_CHECK: ${{ inputs.external_storage_check }}
      - name: Publish autonomous Android test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TunerOS-emulator-self-test-report
          path: |
            on-device-report.txt
            emulator-failure-logcat.txt
            picker.xml
            ui-report.txt
            upgrade-report.txt
            upgrade-recovery-report.txt
          if-no-files-found: warn
          retention-days: 14
