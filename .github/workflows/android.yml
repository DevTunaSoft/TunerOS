name: Android build and tests
on:
  push:
    branches: [main]
    # Documentation-only pushes should not download SDKs, build an APK, or
    # boot an emulator. Keep PR checks and manual dispatch unchanged.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:
concurrency:
  group: tuneros-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check emulator QA shell syntax
        run: bash -n scripts/emulator-self-test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TunerOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-self-test:
    name: Execute TunerOS autonomous self-tests on Android 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TunerOS-debug-apk
          path: ci-apk
      - name: Enable Android emulator KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run the app's built-in checks on a low-memory emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          script: bash scripts/emulator-self-test.sh
      - name: Publish autonomous Android test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TunerOS-emulator-self-test-report
          path: |
            on-device-report.txt
            emulator-failure-logcat.txt
          if-no-files-found: warn
          retention-days: 14
